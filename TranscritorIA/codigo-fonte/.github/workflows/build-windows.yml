name: Compilar Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TRANSCRITOR_DATA_DIR: ${{ github.workspace }}\ci-dados
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Cache dos modelos de teste
        uses: actions/cache@v4
        with:
          path: ci-dados/modelos
          key: modelos-small-v1

      - name: Compilar (testes + whisper.cpp Vulkan/CPU + PyInstaller + pacotes)
        shell: pwsh
        run: ./build/build_windows.ps1

      - name: Validação real 1 — CTranslate2 (CPU) transcrevendo a aula de 5 min
        shell: pwsh
        run: python tools/validar_ci.py dist/TranscritorIA/TranscritorIA-cli.exe small cpu

      - name: Validação real 2 — whisper.cpp (CPU) transcrevendo a aula de 5 min
        shell: pwsh
        run: python tools/validar_ci.py dist/TranscritorIA/TranscritorIA-cli.exe small wcpp-cpu

      - name: Autoteste do executável (áudio de referência)
        shell: pwsh
        run: |
          ./dist/TranscritorIA/TranscritorIA-cli.exe --autoteste --modelo small --motor cpu --baixar --relatorio autoteste_ct2.json
          if ($LASTEXITCODE -ne 0) { throw "autoteste falhou" }

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-validacao
          path: |
            ci-saida/**
            autoteste_*.json
            ci-dados/logs/**

      - name: Programa (portátil + instalador)
        uses: actions/upload-artifact@v4
        with:
          name: TranscritorIA-Windows-x64
          path: dist-instalador/*
          compression-level: 0

      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-instalador/*
          body: |
            Transcritor IA Local — Windows 10/11 x64.
            Baixe o instalador (.exe) ou a versão portátil (.zip). Os modelos de IA são baixados no primeiro uso, com seu consentimento.
